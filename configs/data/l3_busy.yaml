# L3 -- busy events: the acceptance test. VALIDATION ONLY, never trained on.
#
# High multiplicity needs a *different size distribution*, not just more
# objects: keeping the L2 object sizes and stacking 40 of them gives 40%+
# occupancy, which is mush rather than a detector event. Real busy readouts are
# mostly short tracks and small deposits with a few long ones, so the geometry
# block below shortens tracks, shrinks rings and lowers shower energies. That
# lands the mean occupancy at ~20%, matching the top of the stress range.
#
# Cosmics keep their full length -- they are supposed to cross everything.
name: l3_busy
n_events: 20000
seed: 1300
shard_size: 2000
freeze_noise: true          # always use the derived seed -> reproducible numbers

geometry:
  track_len_cm: [2.0, 25.0]
  scat_len_cm: [2.0, 25.0]
  ring_radius_cm: [3.0, 10.0]
  helix_radius_cm: [6.0, 60.0]
  helix_arc_rad: [0.5, 3.0]
  shower_e0_mev: [30.0, 300.0]
  blob_sigma_cm: [0.3, 1.5]

event:
  n_objects: [10, 40]
  p_vertex: 0.6
  vertex_size: [2, 6]
  p_delta: 0.4
  p_crossing: 1.0
  crossing_angle_deg: [3.0, 90.0]
  n_cosmics: [1, 4]

noise:
  enabled: true
  incoherent_adc: [1.0, 5.0]
  coherent_adc: [0.0, 4.0]
  pink_adc: [0.0, 3.0]
  p_blip: 0.6
  n_blips: [5, 40]
