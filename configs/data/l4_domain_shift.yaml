# L4b -- familiar shapes, a detector outside the training envelope.
# VALIDATION ONLY. Coarser pitch, slower response, three times the diffusion.
# This is the transfer measurement the whole project rests on: if performance
# survives here, the model learned the pattern rather than one detector.
name: l4_domain_shift
n_events: 10000
seed: 1500
shard_size: 2000
freeze_noise: true

event:
  n_objects: [2, 5]
  p_vertex: 0.3
  p_delta: 0.15
  p_crossing: 0.3
  n_cosmics: [0, 1]

detector:
  pitch_cm: [0.6, 0.9]              # training envelope is [0.3, 0.5]
  tick_cm: [0.6, 0.9]
  response_width_ticks: [3.0, 6.0]  # training envelope is [1.0, 3.0]
  diffusion_t_cm_sqrt: [0.05, 0.12]
  diffusion_l_cm_sqrt: [0.04, 0.10]
  frac_dead_channels: [0.0, 0.05]

noise:
  enabled: true
