# Track side of the benchmark operating point (patt_reco-cq7, corrected axis).
#
# PROVENANCE. This is d=1.0 of the CORRECTED overlap sweep, which no longer
# sweeps track.curvature: tracks keep tracks.yaml's [0.0, 2.2] and span
# straight through to clearly curved, while only the shower rows tighten.
# Difficulty comes from the showers becoming kinked near-straight polylines
# that resemble SOME tracks and not others -- overlap, rather than the two
# classes trading identities.
#
# MEASURED at this point, paired with showers_hard.yaml: baseline test
# accuracy 0.8325, ROC-AUC 0.9289, 335 wrong of 2000 -- inside the 0.75-0.95
# target band. The small training set is part of the operating point: the
# corrected axis alone still saturates at 4000/class (1.0000), so n_train is
# 100 while n_val and n_test stay large to keep the metric precise. The
# benchmark therefore measures shape ambiguity AND sample efficiency; errors
# run in both directions at low confidence, so the ambiguity is real.
#
# Why 100 and not 250: at n_train=250 the baseline scores 0.9015, sitting
# directly on the 90% acceptance threshold, where run-to-run noise alone would
# flip a PASS/FAIL verdict and a better model would have no headroom. 0.8325
# leaves about seven points to win.
#
# SUPERSEDED: the earlier 0.9995 figure came from the inverted axis, which
# raised this file's curvature floor to 0.5 and made curvature alone decisive.
# Disregard it.
name: tracks_hard
kind: track
label: 0
seed: 3001

n_train: 100
n_val: 500
n_test: 1000

track:
  length: [0.5, 1.0]
  curvature: [0.0, 2.2]    # as tracks.yaml: straight through to clearly curved
  step: 0.002
  value: 1.0

render:
  height: 128
  width: 128
  margin: 0.08
  view: [0.0, 0.0, 1.0]
