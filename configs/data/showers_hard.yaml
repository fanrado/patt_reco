# Shower side of the benchmark operating point (patt_reco-fv3).
#
# PROVENANCE. These values are difficulty d=1.0 of the overlap sweep in
# scripts/sweep.py: a narrow opening angle, almost no transverse spread and
# only 7 nodes, so a shower is a few-segment kinked polyline rather than an
# obvious cone -- as close to a bent line as the generator gets.
#
# MEASURED at d=1.0, paired with tracks_hard.yaml: baseline test accuracy
# 0.9995, ROC-AUC 1.0000 (2000 test images) at the split counts below. That is
# ABOVE the 0.75-0.95 target band. The sweep found the overlap axis alone
# cannot reach the band -- accuracy never drops below 0.999 anywhere in
# d=0..1. Reaching the band additionally needs a smaller training set:
# measured at d=1.0, n_train=100 per class gives 0.9035 and n_train=250 gives
# 0.9460, against 0.9965 at 500 and 0.9985 at 1000.
# Counts and render below match tracks_hard.yaml: build_dataset rejects
# sources that disagree on image size, and matching counts keep the set
# balanced. Override with --set n_train=100 to sit inside the band.
name: showers_hard
kind: shower
label: 1
seed: 4002

n_train: 4000
n_val: 1000
n_test: 1000

shower:
  max_nodes: 7             # d=1.0: a few segments, not a cone
  seg_len: [0.10, 0.20]
  open_angle: [0.02, 0.06] # d=1.0: barely opens
  split_frac: 2.0
  spread: [0.001, 0.004]   # d=1.0: branches read as lines, not a spray
  value: [0.5, 1.5]
  step: 0.004

render:
  height: 128
  width: 128
  margin: 0.08
  view: [0.0, 0.0, 1.0]
