# Shower side of the benchmark operating point (patt_reco-cq7, corrected axis).
#
# PROVENANCE. This is d=1.0 of the CORRECTED overlap sweep. Only the shower
# rows are swept now: a narrow opening angle, almost no transverse spread and
# just 7 nodes turn the cascade into a kinked near-straight polyline, which
# resembles SOME tracks and not others. tracks_hard.yaml keeps the full
# [0.0, 2.2] curvature range, so neither "straight" nor "curved" identifies a
# class -- that is what makes the two overlap rather than trade identities.
#
# BASELINE, paired with tracks_hard.yaml, over FIVE seeds:
#   mean accuracy 0.8910 (sd 0.0179), mean ROC-AUC 0.9257, spread 0.0485
#   mean recall: track 0.8220, shower 0.9600
# Inside the 0.75-0.95 target band. The small training set is part of the
# operating point: the corrected axis alone still saturates at 4000/class
# (1.0000), so n_train is 100 while n_val and n_test stay large to keep the
# metric precise. The benchmark therefore measures shape ambiguity AND sample
# efficiency; errors run in both directions, so the ambiguity is real.
#
# SUPERSEDED: the earlier single-seed 0.8325 / AUC 0.9289 / 335-of-2000 was
# measured before the training-budget fix, when training was bimodal -- half
# of all seeds collapsed to constant-class prediction and 0.8325 came from a
# run that happened to converge. Single-seed numbers are not used for this
# benchmark any more.
#
# Why n_train=100 and not 250: at 250 the baseline sits on the 90% acceptance
# threshold, where run-to-run noise alone would flip a PASS/FAIL verdict and a
# better model would have no headroom.
#
# SUPERSEDED: the earlier 0.9995 figure came from the inverted axis, on which
# every hard shower was near-straight and every hard track an arc, so
# curvature alone separated the classes. Disregard it.
#
# Counts and render match tracks_hard.yaml: build_dataset rejects sources that
# disagree on image size, and matching counts keep the set balanced.
name: showers_hard
kind: shower
label: 1
seed: 4002

n_train: 100
n_val: 500
n_test: 1000

shower:
  max_nodes: 7             # d=1.0: a few segments, not a cone
  seg_len: [0.10, 0.20]
  open_angle: [0.02, 0.06] # d=1.0: barely opens
  split_frac: 2.0
  spread: [0.001, 0.004]   # d=1.0: branches read as lines, not a spray
  value: [0.5, 1.5]
  step: 0.004

render:
  height: 128
  width: 128
  margin: 0.08
  view: [0.0, 0.0, 1.0]
