# L0 -- one object, no noise, a completely fixed detector.
# Purpose: wiring and debugging, and the overfit-one-batch test.
# Every detector parameter is pinned so that anything that varies between two
# L0 events is the geometry and nothing else.
name: l0_single
n_events: 20000
seed: 1000
shard_size: 5000

event:
  n_objects: [1, 1]
  p_vertex: 0.0
  p_delta: 0.0
  p_crossing: 0.0
  n_cosmics: [0, 0]
  class_weights: {track: 1.0, scattered: 1.0, helix: 1.0, ring: 1.0, shower: 1.0, blob: 1.0}

detector:
  pitch_cm: [0.4, 0.4]
  tick_cm: [0.4, 0.4]
  diffusion_t_cm_sqrt: [0.03, 0.03]
  diffusion_l_cm_sqrt: [0.02, 0.02]
  attenuation_cm: [1000.0, 1000.0]
  response_width_ticks: [2.0, 2.0]
  p_bipolar: 0.0
  gain_adc_per_ke: [2.5, 2.5]
  gain_spread: 0.0
  frac_dead_channels: [0.0, 0.0]

noise:
  enabled: false
