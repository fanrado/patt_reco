[build-system]
requires = ["setuptools >= 65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "patt_reco"
version = "0.0.1"
description = "Synthetic line vs shower image generation, and a CNN classifier trained on them, for binary pattern recognition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy >= 1.24",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
dl = ["torch >= 2.0"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["patt_reco*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
